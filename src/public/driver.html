<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Driver Dashboard</title>
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 30px;
      }

      h2 {
        color: #333;
      }

      #loginForm, #driverPanel {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        max-width: 400px;
        margin: auto;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
      }

      input[type="email"], input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      button {
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background-color: #0056b3;
      }

      .booking {
        background-color: #e9ecef;
        border-radius: 5px;
        padding: 10px;
        margin: 10px 0;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h2>Driver Panel</h2>

    <div id="loginForm">
      <label>Email:</label>
      <input type="email" id="email" placeholder="Enter email" />

      <label>Password:</label>
      <input type="password" id="password" placeholder="Enter password" />

      <button onclick="loginDriver()">Login</button>
    </div>

    <div id="driverPanel" class="hidden">
      <p><strong>Logged in as:</strong> <span id="driverName"></span></p>
      <button onclick="registerDriver()">Register for Bookings</button>

      <h3>Incoming Bookings</h3>
      <div id="bookings"></div>
    </div>

    <script>
      const BACKEND_URL = "http://localhost:3000";
      let socket = null;
      let token = null;
      let driverId = null;

      function loginDriver() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        fetch(`${BACKEND_URL}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.success && data.data.token) {
              token = data.data.token;
              driverId = data.data.user._id;

              document.getElementById("driverName").innerText = data.data.user.name;
              document.getElementById("loginForm").classList.add("hidden");
              document.getElementById("driverPanel").classList.remove("hidden");

              initializeSocket();
              alert("Logged in successfully!");
            } else {
              alert("Login failed. Check credentials.");
            }
          })
          .catch((err) => {
            console.error(err);
            alert("Login error");
          });
      }

      function initializeSocket() {
        socket = io(BACKEND_URL, { transports: ["websocket"] });

        socket.on("connect", () => {
          console.log("Socket connected:", socket.id);
        });

        socket.on("newBooking", handleNewBooking);
        socket.on("rideConfirmed", handleRideConfirmed);
        socket.on("removeBooking", handleRemoveBooking);
      }

      function registerDriver() {
        if (!driverId || !token) {
          alert("Please log in first.");
          return;
        }

        socket.emit("registerDriver", driverId);
        console.log("Socket registered for driver:", driverId);

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;

            fetch(`${BACKEND_URL}/api/driver/location`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer${token}`,
              },
              body: JSON.stringify({ driverId, latitude, longitude }),
            })
              .then((res) => {
                if (res.status === 401) {
                  throw new Error("Unauthorized. Invalid token.");
                }
                return res.json();
              })
              .then(console.log)
              .catch((err) => {
                console.error(err);
                alert("Error sending location: " + err.message);
              });
          },
          () => {
            alert("Location access denied");
          }
        );
      }

      function handleNewBooking(data) {
        console.log("New booking received:", data);
        const bookingsDiv = document.getElementById("bookings");
        const bookingEl = document.createElement("div");
        bookingEl.className = "booking";
        bookingEl.id = `booking-${data.bookingId}`;
        bookingEl.innerHTML = `
          <p><strong>New Booking</strong></p>
          <p><b>Source:</b> ${JSON.stringify(data.source)}</p>
          <p><b>Destination:</b> ${JSON.stringify(data.destination)}</p>
          <p><b>Fare:</b> ₹${data.fare.toFixed(2)}</p>
          <button onclick="confirmBooking('${data.bookingId}')">Confirm Ride</button>
        `;
        bookingsDiv.appendChild(bookingEl);
      }

      function handleRideConfirmed(data) {
        alert(`You confirmed booking ${data.bookingId}`);
      }

      function handleRemoveBooking(data) {
        const el = document.getElementById(`booking-${data.bookingId}`);
        if (el) el.remove();
      }

      function confirmBooking(bookingId) {
        if (!token) {
          alert("Token missing. Please login.");
          return;
        }

        fetch(`${BACKEND_URL}/api/booking/confirm`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer${token}`,
          },
          body: JSON.stringify({ bookingId }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.success) {
              alert("Booking confirmed!");
            } else {
              alert("Failed to confirm booking.");
            }
          })
          .catch((err) => {
            console.error(err);
            alert("Error confirming booking");
          });
      }
    </script>
  </body>
</html>
